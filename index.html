<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fatima Javaid | Medical Laboratory Technology Portfolio</title>
<meta name="description" content="Portfolio of Fatima Javaid, final-year BSc Medical Laboratory Technology student in Lahore, Pakistan, interested in molecular diagnostics, research and AI in healthcare.">
<meta name="theme-color" content="#0b2447">
<style>
:root{--navy:#0b2447;--teal:#0e7c86;--sky:#dff1fb;--off:#faf8f3;--ink:#1d2b3a;--mut:#506174;--line:#d7e3ec}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--off)}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
section{padding:64px 0}
h1,h2,h3{color:var(--navy);line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2.3rem,8vw,3.8rem)}
h2{font-size:clamp(1.6rem,4.5vw,2.2rem)}
h3{font-size:1.1rem}
.eye{color:var(--teal);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem}
.mut{color:var(--mut)}
header{position:sticky;top:0;z-index:10;background:rgba(250,248,243,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:800;color:var(--navy);text-decoration:none}
nav ul{display:flex;gap:18px;list-style:none;margin:0;padding:0}
nav ul a{color:var(--navy);text-decoration:none;font-size:.92rem;font-weight:600}
nav ul a:hover{color:var(--teal)}
#mb{display:none;background:none;border:2px solid var(--navy);color:var(--navy);border-radius:8px;padding:6px 12px;font-weight:700}
@media(max-width:860px){#mb{display:block}nav ul{display:none;position:absolute;top:60px;left:0;right:0;flex-direction:column;background:var(--off);padding:14px 20px;border-bottom:1px solid var(--line)}nav ul.open{display:flex}}
.hero{background:radial-gradient(circle at 85% 20%,var(--sky),transparent 55%),var(--off);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(var(--line) 1.2px,transparent 1.2px) 0 0/24px 24px;opacity:.7;pointer-events:none}
.hg{position:relative;display:grid;gap:32px;align-items:center}
@media(min-width:860px){.hg{grid-template-columns:1.3fr .7fr}}
.tag{color:var(--teal);font-weight:700;font-size:1.05rem}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{display:inline-block;padding:12px 20px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid var(--navy);color:var(--navy);background:transparent;transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:var(--navy);color:#fff}
.btn.t{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.off{border-style:dashed;color:var(--mut);border-color:var(--mut);cursor:not-allowed}
.btn.off:hover{transform:none}
.helix{width:100%;max-width:300px;margin:auto;display:block;animation:fl 7s ease-in-out infinite}
.nd{animation:pl 3s ease-in-out infinite alternate}
@keyframes fl{50%{transform:translateY(-10px)}}
@keyframes pl{to{opacity:.35}}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(11,36,71,.1);border-color:var(--teal)}
.card.dash{border-style:dashed;background:transparent}
.alt{background:linear-gradient(180deg,#fff,var(--sky))}
.badge{display:inline-block;background:var(--sky);color:var(--navy);border:1px solid var(--teal);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.85rem;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sky);color:var(--navy);border-radius:999px;padding:5px 14px;font-size:.9rem;font-weight:600}
.feat{border:2px solid var(--teal);padding:clamp(20px,4vw,36px)}
.note{background:var(--sky);border-left:5px solid var(--teal);padding:14px 18px;border-radius:8px;margin-top:18px}
ul{padding-left:1.2em;margin:.4em 0}
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:28px 0}
.flow .n{background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;text-align:center}
.flow .ar{color:var(--teal);font-size:1.5rem;font-weight:700}
@media(max-width:600px){.flow{flex-direction:column}.flow .ar{transform:rotate(90deg)}}
footer{background:var(--navy);color:#d9e6f2;padding:40px 0}
footer a{color:#bfe6f5}
footer .fl{display:flex;flex-wrap:wrap;gap:16px;list-style:none;padding:0}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<header><div class="wrap"><nav aria-label="Main">
<a class="logo" href="#home">Fatima Javaid</a>
<button id="mb" aria-expanded="false" aria-controls="menu">Menu</button>
<ul id="menu"><li><a href="#about">About</a></li><li><a href="#education">Education</a></li><li><a href="#interests">Interests</a></li><li><a href="#research">Research</a></li><li><a href="#skills">Skills</a></li><li><a href="#projects">Projects</a></li><li><a href="#contact">Contact</a></li></ul>
</nav></div></header>
<main id="app"><noscript><p class="wrap">Please enable JavaScript to view this portfolio.</p></noscript></main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
/* ============================================================
   ✏️ EDIT HERE — all your content lives in this one block.
   Change text inside the quotes "..." only. Keep commas and brackets.
   ============================================================ */
const C = {
  name: "Fatima Javaid",
  tagline: "Medical Laboratory Technology | Molecular Diagnostics | Research | AI in Healthcare",
  intro: "I am a final-year BSc Medical Laboratory Technology student at Sheikh Zayed Al Nahyan Medical and Dental College, Lahore, affiliated with the University of Health Sciences. My academic interests include molecular diagnostics, laboratory medicine, clinical research, and the emerging role of artificial intelligence in healthcare. I am interested in exploring how reliable laboratory data and scientific research can contribute to better healthcare understanding and practice.",

  // --- CONTACT ---
  email: "fatimajaved.rollno13@gmail.com",
  phone: "03150149893",
  showPhone: true,          // change to false to hide your phone number
  location: "Lahore, Pakistan",
  linkedin: "",             // paste your full LinkedIn URL here later (https://...)
  github: "",               // paste your full GitHub URL here later (https://...)
  cv: "",                   // after uploading your PDF, put its file name here, e.g. "Fatima-Javaid-CV.pdf"

  // --- ABOUT ---
  about: [
    "I am a final-year BSc Medical Laboratory Technology student in Lahore. My studies have given me a foundation in laboratory medicine, and I am especially drawn to molecular diagnostics and to the way laboratory investigations support clinical decisions.",
    "I am curious about how clinical laboratory data reflect disease patterns, and I value research methodology, careful data handling and evidence-based laboratory practice. My proposed research on calcium measurements in multiple myeloma is currently at the planning stage.",
    "I am also beginning to learn how artificial intelligence and machine learning might be applied responsibly to healthcare data. I see myself as a developing professional who wants to keep learning, seek guidance from supervisors and grow step by step."
  ],

  // --- EDUCATION --- (no dates or grades added on purpose)
  education: { degree: "Bachelor of Science in Medical Laboratory Technology (BSc MLT)", school: "Sheikh Zayed Al Nahyan Medical and Dental College", place: "Lahore, Pakistan", affil: "Affiliated with the University of Health Sciences (UHS), Lahore.", status: "Final-year student" },

  // --- RESEARCH INTERESTS ---
  interests: [
    ["Molecular Diagnostics", "Interest in molecular testing, PCR-based methods, and their applications in clinical diagnosis."],
    ["Clinical Laboratory Medicine", "Interest in interpreting laboratory investigations and understanding their clinical significance."],
    ["Hematology and Biochemistry", "Interest in laboratory parameters, biochemical markers, and their relationships with disease."],
    ["Multiple Myeloma Research", "Interest in the investigation of laboratory biomarkers and biochemical measurements in patients with multiple myeloma."],
    ["AI and Machine Learning in Healthcare", "Interest in learning how computational methods may help analyze clinical and laboratory datasets responsibly."],
    ["Evidence-Based Research", "Interest in research methodology, appropriate statistical analysis, data quality, and ethical research practice."]
  ],

  // --- FEATURED RESEARCH PROJECT ---
  research: {
    title: "Correlation Between Measured Serum Calcium and Albumin-Corrected Calcium Levels in Patients with Multiple Myeloma at a Tertiary Care Hospital in Lahore, Pakistan.",
    status: "Proposed Research — In Planning",   // update when the status changes
    overview: "This proposed study aims to explore the relationship between measured serum calcium and albumin-corrected calcium levels among patients with confirmed multiple myeloma, subject to data availability, supervisor guidance, and the necessary institutional approvals.",
    objectives: ["Describe measured serum calcium and albumin-corrected calcium levels in the eligible study population.", "Assess the correlation between measured serum calcium and albumin-corrected calcium.", "Consider an appropriate agreement analysis to explore whether the two measurements differ systematically."],
    data: ["Measured serum calcium.", "Serum albumin.", "Albumin-corrected calcium calculated using the formula and units approved for the study.", "Relevant de-identified patient records, subject to eligibility criteria and authorization."],
    methods: ["Retrospective review of eligible records, if approved.", "Data cleaning and quality checks.", "Descriptive statistics.", "Correlation analysis.", "Agreement analysis if suitable for the data and confirmed with the research supervisor."],
    note: "Correlation and agreement are different concepts. A strong correlation shows that two measurements rise and fall together; it does not necessarily mean they give closely matching values. Corrected calcium is not assumed to be more accurate than measured calcium.",
    disclaimer: "This is a proposal, not completed research. The final study design and methods will be confirmed with the research supervisor."
  },

  // --- LABORATORY SKILLS --- (move items between lists as you learn; keep "acquired" for confirmed skills only)
  skills: {
    acquired: [],
    learning: [],
    interest: ["PCR and molecular diagnostic techniques", "Hematology investigations", "Clinical biochemistry", "Specimen handling", "Laboratory safety", "Quality control and quality assurance", "Laboratory data management"]
  },

  // --- AI AND HEALTHCARE TECHNOLOGY --- (learning goals only)
  ai: ["Python fundamentals", "Data analysis and visualization", "Statistical methods for laboratory data", "Machine learning fundamentals", "Clinical and laboratory datasets", "Responsible use of healthcare data", "Data privacy and research ethics"],

  // --- PROJECTS --- (copy a block to add another; leave report/github as "" if none)
  projects: [
    { title: "Proposed Research: Serum Calcium in Multiple Myeloma", overview: "Proposed study comparing measured serum calcium with albumin-corrected calcium. See the featured research section above.", role: "Proposed researcher (to be confirmed with supervisor)", tools: "Retrospective record review; descriptive statistics; correlation; agreement analysis (if suitable)", status: "Proposed — In Planning", report: "", github: "" },
    { title: "Project title (placeholder)", overview: "Add a short overview of your project here.", role: "Your role (placeholder)", tools: "Tools or methods (placeholder)", status: "Placeholder — not a real project yet", report: "", github: "", placeholder: true }
  ],

  // --- CERTIFICATES & PROFESSIONAL DEVELOPMENT --- (each: {title:"", type:"Workshop", detail:""})
  certs: []
};
/* ===================== END OF EDIT AREA ===================== */

const e = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ul = a => `<ul>${a.map(x => `<li>${e(x)}</li>`).join("")}</ul>`;
const chips = (a, empty) => a.length ? `<div class="chips">${a.map(x => `<span class="chip">${e(x)}</span>`).join("")}</div>` : `<p class="mut">${empty}</p>`;
const link = (label, url) => url ? `<a href="${e(url)}" target="_blank" rel="noopener">${label}</a>` : "";
const ext = (label, url) => url ? link(label, url) : `<span class="mut">${label}: placeholder, not yet added</span>`;
const sec = (id, eye, title, body, cls = "") => `<section id="${id}" class="${cls}"><div class="wrap rv"><div class="eye">${eye}</div><h2>${title}</h2>${body}</div></section>`;
const R = C.research, E = C.education, S = C.skills;

document.getElementById("app").innerHTML = `
<section id="home" class="hero"><div class="wrap hg">
 <div class="rv"><div class="eye">Portfolio</div><h1>${e(C.name)}</h1><p class="tag">${e(C.tagline)}</p><p>${e(C.intro)}</p>
 <div class="btns"><a class="btn p" href="#projects">Explore My Portfolio</a><a class="btn" href="#interests">Research Interests</a><a class="btn t" href="#contact">Contact Me</a></div></div>
 <svg id="helix" class="helix" viewBox="0 0 300 420" role="img" aria-label="Decorative illustration of a DNA double helix"></svg>
</div></section>
${sec("about", "About", "About Me", C.about.map(p => `<p>${e(p)}</p>`).join(""))}
${sec("education", "Education", "Education", `<div class="card"><span class="badge">${e(E.status)}</span><h3>${e(E.degree)}</h3><p><strong>${e(E.school)}</strong><br>${e(E.place)}</p><p class="mut">${e(E.affil)}</p></div>`)}
${sec("interests", "Interests", "Research Interests", `<p class="mut">These are areas of interest, not completed specializations.</p><div class="grid">${C.interests.map(i => `<div class="card"><h3>${e(i[0])}</h3><p>${e(i[1])}</p></div>`).join("")}</div>`, "alt")}
${sec("research", "Featured Research", "Featured Research Project", `<div class="card feat"><span class="badge">${e(R.status)}</span><h3>${e(R.title)}</h3><p>${e(R.overview)}</p>
<div class="grid"><div><h3>Potential objectives</h3><ol>${R.objectives.map(x => `<li>${e(x)}</li>`).join("")}</ol></div><div><h3>Potential data</h3>${ul(R.data)}</div><div><h3>Potential methodology</h3>${ul(R.methods)}</div></div>
<div class="note"><strong>Scientific note:</strong> ${e(R.note)}</div><p class="mut"><em>${e(R.disclaimer)}</em></p></div>`)}
${sec("skills", "Skills", "Laboratory Skills", `<div class="grid"><div class="card"><h3>Skills Acquired</h3>${chips(S.acquired, "Confirmed skills will be added here.")}</div><div class="card"><h3>Currently Learning</h3>${chips(S.learning, "Techniques in progress will be added here.")}</div><div class="card"><h3>Areas of Interest</h3>${chips(S.interest, "")}</div></div>`, "alt")}
${sec("ai", "AI & Healthcare", "AI and Healthcare Technology", `<p>I am at the start of learning how data science can support laboratory medicine. The topics below are learning interests and future goals, not completed projects or certifications.</p>
<div class="flow" aria-label="Flow from laboratory testing to healthcare research"><div class="n">Laboratory testing</div><span class="ar">→</span><div class="n">Structured data</div><span class="ar">→</span><div class="n">Statistical analysis</div><span class="ar">→</span><div class="n">Healthcare research</div></div>${chips(C.ai, "")}`)}
${sec("projects", "Work", "Projects and Academic Work", `<div class="grid">${C.projects.map(p => `<div class="card ${p.placeholder ? "dash" : ""}"><span class="badge">${e(p.status)}</span><h3>${e(p.title)}</h3><p>${e(p.overview)}</p><p><strong>My role:</strong> ${e(p.role)}<br><strong>Tools / methods:</strong> ${e(p.tools)}</p><p>${[link("Report / poster", p.report), link("GitHub", p.github)].filter(Boolean).join(" · ")}</p></div>`).join("")}</div>`, "alt")}
${sec("certificates", "Development", "Certificates and Professional Development", C.certs.length ? `<div class="grid">${C.certs.map(c => `<div class="card"><span class="badge">${e(c.type || "")}</span><h3>${e(c.title)}</h3><p>${e(c.detail || "")}</p></div>`).join("")}</div>` : `<p class="mut">Professional development records will be added here.</p>`)}
${sec("cv", "CV", "My Curriculum Vitae", `<p>${C.cv ? "My CV is available below." : "An updated CV will be available here soon."}</p>${C.cv ? `<a class="btn p" href="${e(C.cv)}" target="_blank" rel="noopener">View / Download CV (PDF)</a>` : `<span class="btn off" role="button" aria-disabled="true">CV coming soon</span>`}`)}
${sec("contact", "Contact", "Contact Me", `<div class="card"><h3>${e(C.name)}</h3><p>${e(C.location)}</p><p><strong>Email:</strong> <a href="mailto:${e(C.email)}">${e(C.email)}</a></p>${C.showPhone ? `<p><strong>Phone:</strong> <a href="tel:${e(C.phone)}">${e(C.phone)}</a></p>` : ""}<p>${ext("LinkedIn", C.linkedin)}<br>${ext("GitHub", C.github)}</p><a class="btn t" href="mailto:${e(C.email)}">Contact Me</a></div>`, "alt")}`;

document.getElementById("foot").innerHTML = `<h3 style="color:#fff">${e(C.name)}</h3><p>${e(C.tagline)}<br>${e(C.location)}</p><ul class="fl"><li><a href="#home">Home</a></li><li><a href="#about">About</a></li><li><a href="#research">Research</a></li><li><a href="#projects">Projects</a></li><li><a href="#contact">Contact</a></li></ul><p>© ${new Date().getFullYear()} ${e(C.name)}</p>`;

// DNA helix drawn with SVG
(() => {
  let a = "", b = "", r = "", n = "";
  for (let i = 0; i <= 60; i++) {
    const y = 15 + i * 6.7, s = Math.sin(i * 0.26), x1 = 150 + 70 * s, x2 = 150 - 70 * s;
    a += (i ? "L" : "M") + x1.toFixed(1) + " " + y.toFixed(1);
    b += (i ? "L" : "M") + x2.toFixed(1) + " " + y.toFixed(1);
    if (i % 4 === 0) {
      r += `<line x1="${x1.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#7cc4e4" stroke-width="2"/>`;
      n += `<circle class="nd" style="animation-delay:${(i % 8) * 0.3}s" cx="${x1.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="#0e7c86"/><circle class="nd" cx="${x2.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="#0b2447"/>`;
    }
  }
  document.getElementById("helix").innerHTML = `<g fill="none" stroke-width="3" stroke-linecap="round"><path d="${a}" stroke="#0e7c86"/><path d="${b}" stroke="#0b2447"/></g>${r}${n}`;
})();

// Menu toggle
const mb = document.getElementById("mb"), menu = document.getElementById("menu");
mb.onclick = () => mb.setAttribute("aria-expanded", menu.classList.toggle("open"));
menu.onclick = ev => { if (ev.target.tagName === "A") { menu.classList.remove("open"); mb.setAttribute("aria-expanded", "false"); } };

// Fade-in on scroll
const rv = document.querySelectorAll(".rv");
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .08 });
  rv.forEach(x => io.observe(x));
} else rv.forEach(x => x.classList.add("in"));
</script>
</body>
</html>
